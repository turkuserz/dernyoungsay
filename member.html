<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEMBERS - DERNYOUNGSAY</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://img1.pic.in.th/images/DYs.png">
    <!-- นำเข้าฟอนต์ Google Fonts (Anton และ Outfit) -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- SELECTION --- */
        ::selection {
            background: #555555;
            color: #ffffff;
        }
        ::-moz-selection {
            background: #555555;
            color: #ffffff;
        }

        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Outfit', sans-serif;
            color: #e0e0e0;
            overflow: hidden;
            /* พื้นหลังเดียวกันกับหน้าแรก */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://img2.pic.in.th/bgdys.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #0b0b0e;
        }

        /* --- SCREEN HUD CORNER BORDERS --- */
        .hud-border {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            border: 25px solid transparent;
            opacity: 0;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hud-border::before,
        .hud-border::after,
        .hud-corner-br {
            content: '';
            position: absolute;
            width: 35px;
            height: 35px;
            border-color: rgba(255, 255, 255, 0.4);
            border-style: solid;
        }

        .hud-border::before {
            top: 20px;
            left: 20px;
            border-width: 2px 0 0 2px;
        }

        .hud-border::after {
            top: 20px;
            right: 20px;
            border-width: 2px 2px 0 0;
        }

        .hud-corner-br {
            bottom: 20px;
            right: 20px;
            border-width: 0 2px 2px 0;
        }

        /* --- MAIN CONTENT CONTAINER --- */
        .main-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }

        /* --- ANIMATION CLASS --- */
        .animate-up {
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* --- TITLE --- */
        .title-wrapper {
            margin-bottom: 35px;
        }

        .main-title {
            font-family: 'Anton', sans-serif;
            font-size: 4rem;
            letter-spacing: 2px;
            font-weight: 400;
            margin-bottom: 0;
            color: #ffffff;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
            line-height: 1;
            animation-delay: 0.1s;
        }

        /* --- MEMBER LIST BOX --- */
        .member-box {
            width: 420px;
            max-width: 90%;
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 30px;
            animation-delay: 0.2s;
        }

        .member-list {
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .member-list::-webkit-scrollbar {
            width: 4px;
        }

        .member-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .member-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(3px);
        }

        .member-name {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .member-name:hover {
            color: #b0b0b8;
            text-decoration: underline;
        }

        .member-role {
            font-size: 0.75rem;
            color: #b0b0b8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- BACK BUTTON --- */
        .back-button-container {
            display: flex;
            justify-content: center;
            animation-delay: 0.3s;
        }

        .back-button {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 35px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px) scale(1.02);
        }

        .back-text {
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .footer-text {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: #b0b0b8;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 2;
            white-space: nowrap;
            opacity: 0;
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.4s;
        }

        .footer-text a {
            color: #ffffff;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-text a:hover {
            color: #b0b0b8;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 3rem;
            }
            .hud-border {
                border-width: 10px;
            }
            .footer-text {
                font-size: 0.55rem;
                letter-spacing: 1.5px;
            }
        }
    </style>
</head>
<body>

    <!-- ขอบมุม HUD -->
    <div class="hud-border">
        <div class="hud-corner-br"></div>
    </div>

    <!-- เนื้อหาหลัก -->
    <div class="main-container">
        <div class="title-wrapper animate-up">
            <h1 class="main-title">MEMBERS</h1>
        </div>

        <!-- กล่องรายชื่อสมาชิก -->
        <div class="member-box animate-up">
            <ul class="member-list">
                <li class="member-item">
                    <a href="https://www.facebook.com/tim.youngbxy" target="_blank" class="member-name">
                        Tim Dernyoungsay
                    </a>
                    <span class="member-role">MEMBER</span>
                </li>
                <li class="member-item">
                    <a href="https://www.facebook.com/rxnnylesbr" target="_blank" class="member-name">
                        Ronx Dernyoungsay
                    </a>
                    <span class="member-role">MEMBER</span>
                </li>
            </ul>
        </div>

        <!-- ปุ่มกลับหน้าแรก -->
        <div class="back-button-container animate-up">
            <a href="./" class="back-button">
                <i class="fas fa-arrow-left"></i>
                <span class="back-text">BACK TO HOME</span>
            </a>
        </div>
    </div>

    <!-- ส่วนท้าย -->
    <div class="footer-text">©2026 ORIGINAL DESIGN BY <a href="https://discord.gg/PrR76kP6nE" target="_blank">DERNYOUNGSAY</a></div>

</body>
</html>
